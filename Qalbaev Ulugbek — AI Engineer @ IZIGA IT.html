<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qalbaev Ulugbek — AI Engineer @ IZIGA IT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f1efff;--ink:#14123a;--muted:#5b5887;--violet:#6a47ff;--cyan:#00a6b4;--pink:#e0307f;
  --card:rgba(255,255,255,.62);--line:rgba(20,18,58,.14);--node:106,71,255;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f2e;--ink:#f1efff;--muted:#a9a6d6;--violet:#8b6dff;--cyan:#3de0e8;--pink:#ff5fa2;
  --card:rgba(24,26,72,.55);--line:rgba(241,239,255,.16);--node:139,109,255;}}
:root[data-theme="dark"]{--bg:#0d0f2e;--ink:#f1efff;--muted:#a9a6d6;--violet:#8b6dff;--cyan:#3de0e8;--pink:#ff5fa2;--card:rgba(24,26,72,.55);--line:rgba(241,239,255,.16);--node:139,109,255}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden;display:grid;place-items:center}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;width:min(92vw,520px);padding:clamp(28px,6vw,48px);border:1px solid var(--line);border-radius:28px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform-style:preserve-3d;will-change:transform;transition:transform .2s ease-out}
.badge{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem;color:var(--muted);margin-bottom:22px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 var(--cyan);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(2rem,9vw,3.2rem);line-height:1.04;letter-spacing:-.02em}
h1 span{display:block;overflow:hidden}
h1 i{display:inline-block;font-style:normal;transform:translateY(110%) rotate(6deg);animation:up .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--n)*45ms + .2s)}
h1 .l2 i{background:linear-gradient(100deg,var(--violet),var(--pink),var(--cyan));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .9s cubic-bezier(.2,.9,.2,1) forwards,flow 6s linear infinite;animation-delay:calc(var(--n)*45ms + .5s),0s}
@keyframes up{to{transform:none}}
@keyframes flow{to{background-position:200% 0}}
.role{margin-top:22px;font-family:Unbounded,sans-serif;font-weight:500;font-size:1.05rem;color:var(--cyan)}
.role b{display:inline-block;width:2px;height:1.1em;background:var(--cyan);vertical-align:-.15em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
p.about{margin-top:14px;color:var(--muted);line-height:1.6;max-width:42ch}
.links{display:flex;gap:14px;margin-top:32px}
.links a{position:relative;flex:1;aspect-ratio:1/1;max-width:96px;display:grid;place-items:center;border-radius:22px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:transparent;transition:transform .25s,background .25s,color .25s,border-color .25s}
.links a svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.links a:hover,.links a:focus-visible{transform:translateY(-6px);color:#fff;border-color:transparent}
.links a.tg:hover,.links a.tg:focus-visible{background:#2a9fe0}
.links a.ig:hover,.links a.ig:focus-visible{background:linear-gradient(45deg,#f9a03c,#e0307f,#7b3fe4)}
.links a.ml:hover,.links a.ml:focus-visible{background:var(--violet)}
.links a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.links a span{position:absolute;bottom:-26px;font-size:.78rem;color:var(--muted);opacity:0;transition:opacity .2s}
.links a:hover span,.links a:focus-visible span{opacity:1}
.mail{margin-top:44px;font-size:.92rem;color:var(--muted)}
.mail button{font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px dashed var(--muted);cursor:pointer;padding:0 0 1px}
.mail button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.toast{margin-left:10px;color:var(--cyan);opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 i{transform:none}}
</style>
</head>
<body>
<canvas id="net" aria-hidden="true"></canvas>
<main id="card">
  <div class="badge"><span class="pulse"></span>Yangi loyihalar uchun ochiqman</div>
  <h1 aria-label="Qalbaev Ulugbek">
    <span class="l1" aria-hidden="true"></span>
    <span class="l2" aria-hidden="true"></span>
  </h1>
  <div class="role"><span id="typed"></span><b></b></div>
  <p class="about">Sun’iy intellekt tizimlarini loyihalayman, o’qitaman va real mahsulotlarga ulayman.</p>
  <nav class="links" aria-label="Aloqa">
    <a class="tg" href="https://t.me/qalbaev" target="_blank" rel="noopener" aria-label="Telegram">
      <svg viewBox="0 0 24 24"><path d="M21.5 4.2 2.9 11.3c-.9.4-.9 1 0 1.3l4.7 1.5 1.8 5.5c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3-14.5c.3-1.2-.4-1.8-1.4-1.7ZM8.4 13.6l9.7-6.1c.5-.3.9-.1.5.2l-8 7.2-.3 3.4Z"/></svg><span>Telegram</span></a>
    <a class="ig" href="https://instagram.com/qalbaev" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6"/></svg><span>Instagram</span></a>
    <a class="ml" href="mailto:qalbaev2012@gmail.com" aria-label="Pochta">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7.5 8 6 8-6"/></svg><span>Pochta</span></a>
  </nav>
  <p class="mail">qalbaev2012@gmail.com <button id="copy" type="button">nusxa olish</button><span class="toast" id="toast" role="status">Nusxalandi</span></p>
</main>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function split(sel,txt,start){var el=document.querySelector(sel);txt.split('').forEach(function(c,i){var s=document.createElement('i');s.style.setProperty('--n',i+start);s.textContent=c;el.appendChild(s)})}
  split('.l1','Qalbaev',0);split('.l2','Ulugbek',7);
  var t=document.getElementById('typed'),word='AI Engineer @ IZIGA IT',k=0;
  if(reduce){t.textContent=word}else{setTimeout(function type(){t.textContent=word.slice(0,++k);if(k<word.length)setTimeout(type,90)},1300)}
  var cp=document.getElementById('copy'),ts=document.getElementById('toast');
  cp.onclick=function(){var m='qalbaev2012@gmail.com';
    try{navigator.clipboard.writeText(m)}catch(e){}
    ts.classList.add('on');setTimeout(function(){ts.classList.remove('on')},1600)};
  var c=document.getElementById('net'),x=c.getContext('2d'),W,H,P=[],m={x:-999,y:-999},dpr=Math.min(devicePixelRatio||1,2);
  function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(Math.min(90,W*H/14000));P=[];for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35})}
  function rgb(){return getComputedStyle(document.documentElement).getPropertyValue('--node').trim()||'139,109,255'}
  var col=rgb();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){col=rgb()});
  function draw(){x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var a=P[i];
      if(!reduce){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;
        var dx=m.x-a.x,dy=m.y-a.y,d=Math.hypot(dx,dy);if(d<160&&d>1){a.x+=dx/d*.7;a.y+=dy/d*.7}}
      x.fillStyle='rgba('+col+',.85)';x.beginPath();x.arc(a.x,a.y,1.8,0,6.283);x.fill();
      for(var j=i+1;j<P.length;j++){var b=P[j],l=Math.hypot(a.x-b.x,a.y-b.y);
        if(l<130){x.strokeStyle='rgba('+col+','+(1-l/130)*.45+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
    if(!reduce)requestAnimationFrame(draw)}
  size();draw();addEventListener('resize',function(){size();if(reduce)draw()});
  var card=document.getElementById('card');
  addEventListener('pointermove',function(e){m.x=e.clientX;m.y=e.clientY;
    if(!reduce&&e.pointerType==='mouse'){var rx=(e.clientY/H-.5)*-6,ry=(e.clientX/W-.5)*6;card.style.transform='perspective(900px) rotateX('+rx+'deg) rotateY('+ry+'deg)'}});
  addEventListener('pointerleave',function(){m.x=m.y=-999;card.style.transform=''});
})();
</script>
</body>
</html>
